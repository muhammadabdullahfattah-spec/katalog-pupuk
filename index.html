<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk Pupuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-5">

            <span class="navbar-brand mb-0 h1">Toko Pupuk Kita</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            
            <!-- AREA PRODUK: Kamu bisa copy-paste blok di bawah ini untuk produk baru -->

                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Pupuk NPK 16-16-16</h5>

                        <button class="btn btn-outline-primary w-100">Lihat Detail</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Pupuk Organik Cair</h5>
                        <p class="card-text text-muted">Nutrisi organik untuk meningkatkan kualitas tanah secara alami.</p>
                        <button class="btn btn-outline-primary w-100">Lihat Detail</button>
                    </div>
                </div>
            </div>
            <!-- AKHIR AREA PRODUK -->

        </div>
    </div>
